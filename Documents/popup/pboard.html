<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Block</title>
<style>
  :root {
    --card-width: 723px;
    --header-height: 32px;
    --card-height: 81px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    width: 100%;
    min-height: 100vh;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .code-card {
    width: var(--card-width);
    height: var(--card-height);
    margin: 40px auto 0;
    border-radius: 17px;
    overflow: hidden;
    background: #f7f7f7;
  }

  .code-header {
    position: relative;
    height: var(--header-height);
    background: #e8e6e1;
  }

  .language {
    position: absolute;
    left: 8px;
    top: 9px;
    color: #26231e;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                 "Liberation Mono", "Courier New", monospace;
    font-size: 12px;
    line-height: 14px;
    font-weight: 400;
  }

  .copy-button {
    appearance: none;
    -webkit-appearance: none;
    position: absolute;
    top: 7px;
    right: 11px;
    width: 18px;
    height: 18px;
    margin: 0;
    padding: 2px;
    border: 0;
    border-radius: 3px;
    background: transparent;
    color: #66635f;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .copy-button:hover {
    background: rgba(0, 0, 0, 0.045);
  }

  .copy-button svg {
    width: 13px;
    height: 13px;
    display: block;
    pointer-events: none;
  }

  .copy-button:focus-visible {
    outline: 2px solid #777;
    outline-offset: 1px;
  }

  .code-body {
    height: calc(var(--card-height) - var(--header-height));
    padding: 10px 15px 10px;
    background: #f7f7f7;
  }

  .code-body code {
    display: block;
    margin: 0;
    padding: 0;
    color: #26231e;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                 "Liberation Mono", "Courier New", monospace;
    font-size: 14px;
    line-height: 17px;
    font-weight: 400;
    white-space: pre;
  }
</style>
</head>

<body>
  <div class="code-card">
    <div class="code-header">
      <span class="language">text</span>

      <button id="copyButton"
              class="copy-button"
              type="button"
              aria-label="Copy code"
              title="Copy code">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
             aria-hidden="true">
          <rect x="7.4" y="2.7" width="13.0" height="15.2" rx="2.0"
                fill="none" stroke="currentColor" stroke-width="0.8"/>
          <path d="M16.0 18.0v.8A2.45 2.45 0 0 1 13.55 21H4.65A2.45 2.45 0 0 1 2.2 18.55V8.7a2.45 2.45 0 0 1 2.45-2.45h.75"
                fill="none" stroke="currentColor" stroke-width="0.8"
                stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="code-body">
      <code id="code">killall pboard</code>
    </div>
  </div>

  <script>
    const button = document.getElementById("copyButton");
    const code = document.getElementById("code");

    button.addEventListener("click", async () => {
      const value = code.textContent;

      try {
        await navigator.clipboard.writeText(value);
      } catch (err) {
        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }

      button.setAttribute("aria-label", "Copied");
      button.title = "Copied";
      setTimeout(() => {
        button.setAttribute("aria-label", "Copy code");
        button.title = "Copy code";
      }, 1000);
    });
  </script>
</body>
</html>
